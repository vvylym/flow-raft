# Observability stack: Prometheus, Grafana, Jaeger.
# Use with main compose: docker compose -f docker-compose.yml -f opentelemetry/docker-compose.yml up -d
# Or standalone: docker compose -f opentelemetry/docker-compose.yml up -d
# Prometheus scrapes node-1:9090, node-2:9091, node-3:9092 when on the same network as the main stack.

services:
  prometheus:
    image: prom/prometheus:v2.52.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9093:9090"
    networks:
      - flowraft

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - flowraft

  jaeger:
    image: jaegertracing/all-in-one:1.55
    ports:
      - "16686:16686"
      - "14268:14268"
    networks:
      - flowraft

volumes:
  grafana-data:

networks:
  flowraft:
    external: true
