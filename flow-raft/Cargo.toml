[package]
name = "flow-raft"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true
readme = "README.md"
publish = false

[dependencies]
flow-raft-core = { path = "../flow-raft-core" }
flow-raft-raft = { path = "../flow-raft-raft" }
flow-raft-api = { path = "../flow-raft-api" }
flow-raft-observability = { path = "../flow-raft-observability" }
flow-raft-server = { path = "../flow-raft-server" }
clap = { workspace = true }
uuid = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json.workspace = true
chrono.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
openraft = { workspace = true }

[[bin]]
name = "flowraft"
path = "src/bin/flowraft.rs"

[[bin]]
name = "flowraft-node"
path = "src/bin/flowraft-node.rs"

[dev-dependencies]
assert_cmd = "2.1"
predicates = "3.1"
indexmap = { workspace = true }
portpicker = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[lints]
workspace = true
