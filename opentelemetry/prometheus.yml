# Prometheus config when using with docker-compose (main + opentelemetry).
# Scrapes /metrics from node-1, node-2, node-3 on the flowraft network.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "flowraft"
    static_configs:
      - targets: ["node-1:9090", "node-2:9091", "node-3:9092"]
    metrics_path: /metrics
