[workspace]
members = [
    "flow-raft",
    "flow-raft-core",
    "flow-raft-testing",
    "flow-raft-raft",
    "flow-raft-api",
    "flow-raft-observability",
    "flow-raft-proto",
    "flow-raft-server",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
authors = ["Guillaume M. <235853469+vvylym@users.noreply.github.com>"]
license = "MIT"
repository = "https://github.com/vvylym/flow-raft"
description = "A distributed, stateful workflow engine optimized for correctness, fault tolerance, and deterministic execution."

[workspace.dependencies]
# Core dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.20", features = ["serde", "v4"] }
thiserror = "2.0"
indexmap = { version = "2.13", features = ["serde", "rayon"] }
smallvec = { version = "1.15", features = ["serde"] }

# Raft
openraft = { version = "0.9", features = ["serde", "storage-v2"] }

# Async
tokio = { version = "1.49", features = ["full"] }
futures = "0.3"
tokio-stream = "0.1"

# Observability (latest versions)
metrics = "0.24"
metrics-exporter-prometheus = "0.18"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
opentelemetry = { version = "0.31", features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.31", features = ["trace", "grpc-tonic"] }
tracing-opentelemetry = "0.32"

# gRPC
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"

# Utilities
derive_more = { version = "2.1", features = ["display"] }
rayon = "1.11"
http-body-util = "0.1"
bytes = "1.11"

# Build dependencies
tonic-prost-build = "0.14"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Dev dependencies are defined in individual crate Cargo.toml files
# This section is kept for reference but not used by workspace resolver
# [workspace.dev-dependencies]
# criterion = "0.5"
# rstest = "0.26"
# pprof = "0.13"
# inferno = "0.13"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

# Benchmarks are defined at the workspace root level
# They are in the benches/ directory
