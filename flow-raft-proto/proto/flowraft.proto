syntax = "proto3";

package flowraft;

// FlowRaft gRPC service
service FlowRaftService {
  // Node Management
  rpc GetNodeStatus(GetNodeStatusRequest) returns (NodeStatus);
  
  // Workflow Management
  rpc DefineWorkflow(DefineWorkflowRequest) returns (WorkflowDefinition);
  rpc TriggerWorkflow(TriggerWorkflowRequest) returns (WorkflowExecution);
  rpc GetWorkflow(GetWorkflowRequest) returns (WorkflowStatus);
  rpc ListWorkflows(ListWorkflowsRequest) returns (WorkflowList);
  rpc PauseWorkflow(PauseWorkflowRequest) returns (WorkflowStatus);
  rpc ResumeWorkflow(ResumeWorkflowRequest) returns (WorkflowStatus);
  rpc CancelWorkflow(CancelWorkflowRequest) returns (WorkflowStatus);
  
  // Observability
  rpc WatchWorkflow(WatchWorkflowRequest) returns (stream WorkflowUpdate);
  rpc GetExecutionHistory(GetExecutionHistoryRequest) returns (ExecutionHistory);
  rpc GetTaskResults(GetTaskResultsRequest) returns (TaskResults);

  // Distributed execution: run a single task on this node (returns output; caller applies state)
  rpc RunTask(RunTaskRequest) returns (RunTaskResponse);
}

message RunTaskRequest {
  string workflow_id = 1;
  string task_id = 2;
  string handler_name = 3;
  optional string inputs = 4; // JSON string
}

message RunTaskResponse {
  optional string outputs = 1; // JSON string on success
  optional string error = 2;   // error message on failure
}

// Node Management Messages
message GetNodeStatusRequest {
  uint64 node_id = 1;
}

message NodeStatus {
  uint64 node_id = 1;
  string mode = 2;
  bool is_leader = 3;
  repeated uint64 cluster_nodes = 4;
}

// Workflow Management Messages
message DefineWorkflowRequest {
  string name = 1;
  string definition = 2; // JSON string of workflow definition
}

message WorkflowDefinition {
  string workflow_id = 1;
  string name = 2;
  string status = 3;
}

message TriggerWorkflowRequest {
  string workflow_id = 1;
  optional string inputs = 2; // JSON string of inputs
}

message WorkflowExecution {
  string execution_id = 1;
  string workflow_id = 2;
  string status = 3;
  optional string error = 4;
}

message GetWorkflowRequest {
  string workflow_id = 1;
}

message WorkflowStatus {
  string workflow_id = 1;
  string state = 2;
  repeated TaskStatus tasks = 3;
  optional string error_message = 4;
  optional string outputs = 5; // JSON string
  int64 created_at = 6;
  optional int64 started_at = 7;
  optional int64 completed_at = 8;
}

message TaskStatus {
  string task_id = 1;
  string state = 2;
  int32 attempts = 3;
  optional string error = 4;
  optional string outputs = 5; // JSON string
  optional int64 started_at = 6;
  optional int64 completed_at = 7;
}

message ListWorkflowsRequest {
  optional string filter = 1; // Optional filter (e.g., "state=running")
  int32 limit = 2;
  int32 offset = 3;
}

message WorkflowList {
  repeated WorkflowSummary workflows = 1;
  int32 total = 2;
}

message WorkflowSummary {
  string workflow_id = 1;
  string state = 2;
  int32 total_tasks = 3;
  int32 completed_tasks = 4;
  int32 failed_tasks = 5;
  int64 created_at = 6;
}

message PauseWorkflowRequest {
  string workflow_id = 1;
}

message ResumeWorkflowRequest {
  string workflow_id = 1;
}

message CancelWorkflowRequest {
  string workflow_id = 1;
}

// Observability Messages
message WatchWorkflowRequest {
  string workflow_id = 1;
}

message WorkflowUpdate {
  string workflow_id = 1;
  string event_type = 2; // "state_change", "task_completed", "task_failed", etc.
  optional string data = 3; // JSON string with update details
  int64 timestamp = 4;
}

message GetExecutionHistoryRequest {
  string workflow_id = 1;
  int32 limit = 2;
}

message ExecutionHistory {
  string workflow_id = 1;
  repeated ExecutionEvent events = 2;
}

message ExecutionEvent {
  string event_type = 1;
  optional string task_id = 2;
  string data = 3; // JSON string
  int64 timestamp = 4;
}

message GetTaskResultsRequest {
  string workflow_id = 1;
  string task_id = 2;
}

message TaskResults {
  string task_id = 1;
  string state = 2;
  optional string outputs = 3; // JSON string
  optional string error = 4;
  int32 attempts = 5;
  optional int64 started_at = 6;
  optional int64 completed_at = 7;
}
